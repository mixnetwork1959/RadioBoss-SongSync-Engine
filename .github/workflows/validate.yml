name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reject private runtime files
        run: |
          test ! -e config.py
          test ! -e config.json
          test ! -e config.json.bak
          test ! -e sftp_key
          test ! -e sftp_known_hosts
